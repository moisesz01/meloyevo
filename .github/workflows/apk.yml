name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar llave de firma
        env:
          MELOYEVO_KEYSTORE_BASE64: ${{ secrets.MELOYEVO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MELOYEVO_KEYSTORE_BASE64" ]; then
            echo "Configure el secreto MELOYEVO_KEYSTORE_BASE64 en GitHub."
            exit 1
          fi
          printf '%s' "$MELOYEVO_KEYSTORE_BASE64" | base64 --decode > app/meloyevo.jks

      - name: Compilar APK de release
        env:
          MELOYEVO_KEYSTORE_PATH: app/meloyevo.jks
          MELOYEVO_KEYSTORE_PASSWORD: ${{ secrets.MELOYEVO_KEYSTORE_PASSWORD }}
          MELOYEVO_KEY_ALIAS: ${{ secrets.MELOYEVO_KEY_ALIAS }}
          MELOYEVO_KEY_PASSWORD: ${{ secrets.MELOYEVO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: meloyevo-apk
          path: app/build/outputs/apk/release/*.apk
